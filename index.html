<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Buscador NV - Vendedor AF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .vendor-badge {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            display: inline-block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.2em;
        }

        .content {
            padding: 40px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
            border-left: 5px solid #4facfe;
        }

        .result-container.error {
            background: #fff5f5;
            border-left-color: #ff6b6b;
        }

        .result-container.success {
            background: #f0fff4;
            border-left-color: #51cf66;
        }

        .phase {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #e1e1e1;
        }

        .phase.completed {
            border-left-color: #51cf66;
        }

        .phase.pending {
            border-left-color: #ffd43b;
        }

        .phase-header {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-completed {
            background: #d3f9d8;
            color: #2b8a3e;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
        }

        .info-label {
            font-weight: bold;
            color: #495057;
            font-size: 0.9em;
        }

        .info-value {
            color: #212529;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e1e1e1;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .content {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .export-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Buscador de Notas de Venta</h1>
            <div class="vendor-badge">👤 Vendedor: AF</div>
            <div style="margin-top: 10px;">
                <small id="ultimaActualizacion" style="opacity: 0.8;">Cargando datos...</small>
            </div>
        </div>

        <div class="content">
            <div class="search-section">
                <h2>🔎 Buscar Nota de Venta</h2>
                <div class="search-box">
                    <div class="input-group">
                        <input type="text" id="numeroNV" placeholder="Ingresa el número de la Nota de Venta" />
                    </div>
                    <button class="btn btn-primary" onclick="buscarNotaVenta()">
                        <span>🔍</span> Buscar
                    </button>
                </div>

                <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                    <button class="btn btn-secondary" onclick="buscarTodasMisNV()">
                        <span>📋</span> Todas mis NV
                    </button>
                    <button class="btn btn-secondary" onclick="buscarPendientes()">
                        <span>⏳</span> Por Definir
                    </button>
                    <button class="btn btn-secondary" onclick="buscarCompletadas()">
                        <span>✅</span> Despacho Definido
                    </button>
                </div>

                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 20px;">
                    <button class="btn btn-primary" onclick="refrescarDatos()" id="btnRefrescar">
                        <span>🔄</span> Refrescar Ahora
                    </button>
                    
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                        <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()" style="margin: 0;">
                        <span>🔄 Auto-refrescar cada 2 minutos</span>
                    </label>
                    
                    <div style="margin-left: auto; text-align: right;">
                        <div id="estadoConexion" style="font-weight: bold; margin-bottom: 3px;">🔄 Verificando...</div>
                        <div id="proximaActualizacion" style="font-size: 0.8em; color: #666;"></div>
                    </div>
                </div>
            </div>

            <div id="resultados"></div>
        </div>
    </div>

    <script>
        // Configuración del vendedor
        const VENDEDOR = 'AF';
        
        // Múltiples URLs para intentar conexión
        const URLS_CONEXION = {
            csv_original: 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/export?format=csv&gid=0',
            csv_alternativo: 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/gviz/tq?tqx=out:csv&sheet=Registros',
            json_api: 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/gviz/tq?tqx=out:json&sheet=Registros'
        };

        // Variables globales
        let datosCompletos = [];
        let encabezados = [];
        let ultimaActualizacion = null;
        let intervalRefresh = null;
        let datosOriginales = '';

        // Cargar datos al inicio
        window.addEventListener('load', function() {
            cargarDatos();
            // Auto-refrescar cada 2 minutos por defecto
            document.getElementById('autoRefresh').checked = true;
            toggleAutoRefresh();
        });

        // Permitir buscar con Enter
        document.getElementById('numeroNV').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarNotaVenta();
            }
        });

        // FUNCIÓN PRINCIPAL MEJORADA
        async function cargarDatos(mostrarNotif = true) {
            try {
                if (mostrarNotif) mostrarCargando();
                
                actualizarEstadoConexion('🔄 Conectando...', 'info');
                console.log('📊 Conectando con Google Sheets...');
                
                // Intentar múltiples métodos en orden
                await intentarTodosLosMétodos(mostrarNotif);
                
            } catch (error) {
                console.error('❌ Todos los métodos fallaron:', error);
                actualizarEstadoConexion('❌ Sin conexión', 'error');
                
                if (mostrarNotif) {
                    mostrarError('No se pudieron cargar los datos. Usando datos de ejemplo.');
                    await simularCargaDatos();
                }
            }
        }

        // INTENTAR TODOS LOS MÉTODOS DISPONIBLES
        async function intentarTodosLosMétodos(mostrarNotif = true) {
            const métodos = [
                { nombre: 'JSONP directo', función: () => cargarConJSONP() },
                { nombre: 'Proxy AllOrigins', función: () => cargarConProxy('https://api.allorigins.win/raw?url=', URLS_CONEXION.csv_original, mostrarNotif) },
                { nombre: 'Proxy CORS Anywhere', función: () => cargarConProxy('https://cors-anywhere.herokuapp.com/', URLS_CONEXION.csv_original, mostrarNotif) },
                { nombre: 'CSV alternativo directo', función: () => cargarDatosDirecto(URLS_CONEXION.csv_alternativo, mostrarNotif) },
                { nombre: 'CSV original directo', función: () => cargarDatosDirecto(URLS_CONEXION.csv_original, mostrarNotif) }
            ];
            
            for (const método of métodos) {
                try {
                    console.log(`🔄 Intentando: ${método.nombre}`);
                    await método.función();
                    console.log(`✅ Éxito con: ${método.nombre}`);
                    return; // Salir al primer éxito
                } catch (error) {
                    console.log(`❌ ${método.nombre} falló:`, error.message);
                    continue;
                }
            }
            
            throw new Error('Ningún método de conexión funcionó');
        }

        // MÉTODO 1: JSONP (MÁS COMPATIBLE)
        async function cargarConJSONP() {
            return new Promise((resolve, reject) => {
                const callbackName = 'gsc_' + Date.now();
                
                window[callbackName] = function(response) {
                    try {
                        // Limpiar
                        if (script && script.parentNode) {
                            script.parentNode.removeChild(script);
                        }
                        delete window[callbackName];
                        
                        if (response && response.table && response.table.rows) {
                            // Extraer encabezados
                            const cols = response.table.cols || [];
                            encabezados = cols.map(col => col.label || col.id || '');
                            
                            // Extraer datos
                            datosCompletos = response.table.rows.map(row => {
                                return row.c ? row.c.map(cell => {
                                    if (!cell) return '';
                                    return cell.f || cell.v || ''; // f = formatted value, v = raw value
                                }) : [];
                            });
                            
                            console.log(`✅ JSONP: ${encabezados.length} columnas, ${datosCompletos.length} filas`);
                            
                            finalizarCargaDatos('JSONP', true);
                            resolve(true);
                        } else {
                            reject(new Error('Respuesta JSONP inválida'));
                        }
                    } catch (error) {
                        reject(error);
                    }
                };
                
                const script = document.createElement('script');
                script.src = URLS_CONEXION.json_api + '&tqx=out:json;responseHandler:' + callbackName;
                script.onerror = () => reject(new Error('Error cargando script JSONP'));
                
                document.head.appendChild(script);
                
                // Timeout
                setTimeout(() => {
                    if (window[callbackName]) {
                        if (script && script.parentNode) {
                            script.parentNode.removeChild(script);
                        }
                        delete window[callbackName];
                        reject(new Error('Timeout JSONP (10s)'));
                    }
                }, 10000);
            });
        }

        // MÉTODO 2: CON PROXY
        async function cargarConProxy(proxyUrl, targetUrl, mostrarNotif = true) {
            const url = proxyUrl + encodeURIComponent(targetUrl);
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`Error proxy: ${response.status}`);
            }
            
            const csvText = await response.text();
            procesarCSV(csvText, `proxy: ${proxyUrl}`, mostrarNotif);
        }

        // MÉTODO 3: DIRECTO
        async function cargarDatosDirecto(url, mostrarNotif = true) {
            const response = await fetch(url);
            
            if (!response.ok) {
                throw new Error(`Error HTTP: ${response.status}`);
            }
            
            const csvText = await response.text();
            procesarCSV(csvText, 'directo', mostrarNotif);
        }

        // PROCESAR CSV
        function procesarCSV(csvText, metodo, mostrarNotif = true) {
            console.log(`✅ CSV obtenido via: ${metodo}`);
            console.log(`📄 Tamaño: ${csvText.length} caracteres`);
            
            const hayNuevosDatos = csvText !== datosOriginales;
            datosOriginales = csvText;
            
            const datos = parseCSVAvanzado(csvText);
            
            if (datos.length > 0) {
                encabezados = datos[0];
                datosCompletos = datos.slice(1);
                
                finalizarCargaDatos(metodo, mostrarNotif, hayNuevosDatos);
            } else {
                throw new Error('No se pudieron procesar los datos CSV');
            }
        }

        // FINALIZAR CARGA DE DATOS
        function finalizarCargaDatos(metodo, mostrarNotif = true, hayNuevosDatos = false) {
            console.log(`📋 Encabezados: ${encabezados.length} columnas`);
            console.log(`📊 Registros: ${datosCompletos.length} filas`);
            
            // Contar registros del vendedor
            const misRegistros = datosCompletos.filter(row => {
                const vendedorNV = row[3] ? row[3].toString().toUpperCase() : '';
                const vendedorProceso = row[12] ? row[12].toString().toUpperCase() : '';
                return vendedorNV === VENDEDOR || vendedorProceso === VENDEDOR;
            });
            
            console.log(`👤 Registros para ${VENDEDOR}: ${misRegistros.length}`);
            
            // Actualizar estado
            ultimaActualizacion = new Date();
            actualizarUltimaActualizacion();
            actualizarEstadoConexion(`✅ Conectado (${metodo})`, 'success');
            
            if (mostrarNotif) {
                const mensaje = hayNuevosDatos ? 
                    `🆕 ${datosCompletos.length} registros actualizados (${misRegistros.length} para ${VENDEDOR})` :
                    `✅ ${datosCompletos.length} registros cargados (${misRegistros.length} para ${VENDEDOR})`;
                
                mostrarNotificacion(mensaje);
                ocultarCargando();
            } else if (hayNuevosDatos) {
                mostrarNotificacionSilenciosa(`🔄 Datos actualizados automáticamente`);
            }
        }

        // Parser CSV avanzado
        function parseCSVAvanzado(csv) {
            const result = [];
            let current = '';
            let inQuotes = false;
            let row = [];
            
            for (let i = 0; i < csv.length; i++) {
                const char = csv[i];
                const nextChar = csv[i + 1];
                
                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        // Comillas escapadas ""
                        current += '"';
                        i++; // Saltar la siguiente comilla
                    } else {
                        // Cambiar estado de comillas
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    // Nueva columna
                    row.push(current.trim());
                    current = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    // Nueva fila
                    if (char === '\r' && nextChar === '\n') {
                        i++; // Saltar \r\n
                    }
                    
                    row.push(current.trim());
                    
                    // Solo agregar filas que no estén completamente vacías
                    if (row.some(cell => cell !== '')) {
                        result.push(row);
                    }
                    
                    row = [];
                    current = '';
                } else {
                    current += char;
                }
            }
            
            // Agregar última fila si existe contenido
            if (current !== '' || row.length > 0) {
                row.push(current.trim());
                if (row.some(cell => cell !== '')) {
                    result.push(row);
                }
            }
            
            return result;
        }

        // Función de respaldo con datos de ejemplo
        async function simularCargaDatos() {
            console.log('🔄 Cargando datos de ejemplo...');
            
            datosCompletos = [
                ['2025-08-20 15:09', '25634', '23', 'AF', 'PAGADO', 'Santander', 'Foto NV1', '', '', 'LCT', '25634', 'NV', 'AF', 'JM', '2025-08-20 15:37:01', 'Completas de latas de hogar más 24 latas de hogar', '2025-08-20 15:37:01', 'Doc', 'F1', 'F2', 'F3', 'F4', '', '', '', '', '', '', 'CQ', 'Serkotal', 'Retiro', '', '1', '2025-08-20', ''],
                ['2025-08-20 15:08', '25620', '22', 'AF', 'PAGADO', 'Santander', 'Foto NV1', '', '', 'LCT', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', 'Sandra reyes', 'Envío', 'TUTTO PETS', '1', '2025-08-20', ''],
                ['2025-08-20 13:01', '25639', '21', 'AF', 'PAGADO', 'Santander', 'Foto NV1', '', '', 'LCT', '25639', 'NV', 'AF', 'JM', '2025-08-20 13:17:45', '10 varas telescopicas 4.5 m entregado', '2025-08-20 13:17:45', 'Doc', 'F1', '', '', '', '', '', '', '', '', '', 'AM', 'Jaime sotolay', 'Envío', 'STARKEN', '1', '2025-08-20', '']
            ];

            encabezados = ['FECHA', 'Numero NV', 'Turno NV', 'Vendedor NV', 'Status NV', 'Observaciones NV', 'Foto NV 1 Link', 'Foto NV 2 Link', 'Foto NV 3 Link', 'Usuario', 'Numero NV 2', 'Origen', 'Vendedor', 'Ejecutor', 'FECHA', 'Descripción', 'Fecha Verif', 'Doc PPAL', 'Foto 1', 'Foto 2', 'Foto 3', 'Foto 4', 'Foto 5', 'Foto 6', 'Foto 7', 'Foto 8', 'Foto 9', 'Foto 10', 'ENTREGADO POR', 'RECIBIDO POR', 'FOTO 1 ENTREGA', 'FOTO 2 ENT', 'FOTO 3 ENT', 'ENTREGADO EL', 'ARMADO POR', 'CLIENTE', 'TIPO DE ENVIO', 'COURRIER', 'BULTOS', 'FECHA', 'Reporte Impreso'];

            mostrarNotificacion('⚠️ Usando datos de ejemplo. Configura acceso público en Google Sheets.');
            ocultarCargando();
        }

        function buscarNotaVenta() {
            const numeroNV = document.getElementById('numeroNV').value.trim();
            
            if (!numeroNV) {
                mostrarError('Por favor, ingresa un número de Nota de Venta.');
                return;
            }

            const resultado = buscarNVenDatos(numeroNV);
            
            if (resultado.encontrada) {
                // Verificar si pertenece al vendedor AF
                const vendedorNV = resultado.data[3] ? resultado.data[3].toString().toUpperCase() : '';
                const vendedorProceso = resultado.data[12] ? resultado.data[12].toString().toUpperCase() : '';
                
                if (vendedorNV === VENDEDOR || vendedorProceso === VENDEDOR) {
                    mostrarResultado(resultado);
                } else {
                    mostrarError(`La Nota de Venta ${numeroNV} no pertenece al vendedor ${VENDEDOR}.`);
                }
            } else {
                mostrarError(`No se encontró la Nota de Venta con el número: ${numeroNV}`);
            }
        }

        function buscarNVenDatos(numeroNV) {
            for (let i = 0; i < datosCompletos.length; i++) {
                if (datosCompletos[i][1] && datosCompletos[i][1].toString() === numeroNV) {
                    return {
                        encontrada: true,
                        data: datosCompletos[i],
                        fila: i + 1
                    };
                }
            }
            return { encontrada: false };
        }

        function buscarTodasMisNV() {
            const misNV = datosCompletos.filter(row => {
                const vendedorNV = row[3] ? row[3].toString().toUpperCase() : '';
                const vendedorProceso = row[12] ? row[12].toString().toUpperCase() : '';
                return vendedorNV === VENDEDOR || vendedorProceso === VENDEDOR;
            });

            if (misNV.length > 0) {
                mostrarListaNV(misNV, `📋 Todas las NV del vendedor ${VENDEDOR} (${misNV.length} encontradas)`);
            } else {
                mostrarError(`No se encontraron Notas de Venta para el vendedor ${VENDEDOR}.`);
            }
        }

        function buscarPendientes() {
            const misNV = datosCompletos.filter(row => {
                const vendedorNV = row[3] ? row[3].toString().toUpperCase() : '';
                const vendedorProceso = row[12] ? row[12].toString().toUpperCase() : '';
                const tipoEnvio = row[36] && row[36].toString().trim() !== '';
                
                return (vendedorNV === VENDEDOR || vendedorProceso === VENDEDOR) && !tipoEnvio;
            });

            if (misNV.length > 0) {
                mostrarListaNV(misNV, `⏳ NV por Definir del vendedor ${VENDEDOR} (${misNV.length} encontradas)`);
            } else {
                mostrarInfo(`✅ No hay NV por definir para el vendedor ${VENDEDOR}.`);
            }
        }

        function buscarCompletadas() {
            const misNV = datosCompletos.filter(row => {
                const vendedorNV = row[3] ? row[3].toString().toUpperCase() : '';
                const vendedorProceso = row[12] ? row[12].toString().toUpperCase() : '';
                const tipoEnvio = row[36] && row[36].toString().trim() !== '';
                
                return (vendedorNV === VENDEDOR || vendedorProceso === VENDEDOR) && tipoEnvio;
            });

            if (misNV.length > 0) {
                mostrarListaNV(misNV, `✅ NV con Despacho Definido del vendedor ${VENDEDOR} (${misNV.length} encontradas)`);
            } else {
                mostrarInfo(`No hay NV con despacho definido para el vendedor ${VENDEDOR}.`);
            }
        }

        function mostrarResultado(resultado) {
            const data = resultado.data;
            const numeroNV = data[1] || data[10] || 'Sin número';
            
            // Evaluar fases
            const tieneEjecutor = data[13] && data[13].toString().trim() !== '';
            const tieneArmado = data[34] && data[34].toString().trim() !== '';
            const tipoEnvio = data[36] && data[36].toString().trim() !== '' ? data[36].toString().trim() : '';
            const courier = data[37] && data[37].toString().trim() !== '' ? data[37].toString().trim() : '';

            let html = `

        // Función para toggle auto-refresh
        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (intervalRefresh) {
                clearInterval(intervalRefresh);
                intervalRefresh = null;
            }
            
            if (checkbox.checked) {
                // Activar auto-refresh cada 2 minutos
                intervalRefresh = setInterval(async () => {
                    console.log('🔄 Auto-refresh activado');
                    await cargarDatos(false); // Sin mostrar notificaciones ruidosas
                }, 120000); // 2 minutos
                
                iniciarContadorProximaActualizacion();
                console.log('✅ Auto-refresh activado (cada 2 minutos)');

                actualizarProximaActualizacion('Auto-refresh desactivado');

        // Contador para próxima actualización
        function iniciarContadorProximaActualizacion() {
            let segundosRestantes = 120; // 2 minutos
            
            const actualizarContador = () => {
                if (segundosRestantes > 0) {
                    const minutos = Math.floor(segundosRestantes / 60);
                    const segundos = segundosRestantes % 60;
                    actualizarProximaActualizacion(`Próxima actualización en: ${minutos}:${segundos.toString().padStart(2, '0')}`);
                    segundosRestantes--;
                } else {
                    segundosRestantes = 120; // Reiniciar contador
                }
            };
            
            // Actualizar inmediatamente y luego cada segundo
            actualizarContador();
            const contadorInterval = setInterval(() => {
                if (!document.getElementById('autoRefresh').checked) {
                    clearInterval(contadorInterval);
                    return;
                }
                actualizarContador();
            }, 1000);
        }

function logElement(tag, text, className) {
    const element = document.createElement(tag);
    if (text !== undefined) element.textContent = text;
    if (className) element.className = className;
    return element;
}

function logSafeUrl(value) {
    try {
        const url = new URL(value);
        return url.protocol === 'https:' ? url : null;
    } catch { return null; }
}

function logDriveId(url) {
    if (!['drive.google.com', 'docs.google.com'].includes(url.hostname)) return null;
    const id = url.pathname.match(/\/d\/([\w-]+)/)?.[1] || url.searchParams.get('id');
    return id && /^[\w-]+$/.test(id) ? id : null;
}

function logOriginalLink(url) {
    const link = logElement('a', 'Abrir archivo original ↗');
    link.href = url.href;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    return link;
}

    close.type = 'button';

    top.append(close);
    dialog.append(top, logOriginalLink(url));
    if (id) {
        const frame = document.createElement('iframe');
        frame.src = `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
        frame.title = label;
        frame.allowFullscreen = true;
        dialog.append(frame);
    } else {
        const image = document.createElement('img');
        image.src = url.href;
        image.alt = label;
        image.onerror = () => { image.replaceWith(logElement('p', 'Vista previa no disponible. Abre el archivo original.')); };
        dialog.append(image);
    }
    dialog.append(logElement('p', 'Si Drive solicita acceso, abre el archivo original con tu cuenta autorizada.'));
    dialog.addEventListener('close', () => { dialog.remove(); opener?.focus(); });
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    document.body.append(dialog);
    dialog.showModal();
    close.focus();
}

function logRenderPhotos(host, records) {
    host.replaceChildren();
    let count = 0;
    for (const record of records) {
        const photos = Object.entries(record.fotos || {}).filter(([, photo]) => logSafeUrl(typeof photo === 'string' ? photo : photo?.url));
        if (!photos.length) continue;
        const section = logElement('section');
        section.append(logElement('h4', `NV ${record.numeroNV || ''} · ${record.vendedor || 'Sin vendedor'} · ${photos.length} archivos`));
        const grid = logElement('div', undefined, 'log-photo-grid');
        for (const [name, photo] of photos) {
            const url = logSafeUrl(typeof photo === 'string' ? photo : photo.url);
            const id = logDriveId(url);
            const label = photo.texto && photo.texto !== name ? `${name} · ${photo.texto}` : name;
            const card = logElement('article', undefined, 'log-photo-card');
            card.append(logElement('strong', label));
            const image = document.createElement('img');
            image.alt = label;
            image.loading = 'lazy';
            image.src = id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w600` : url.href;
            image.onerror = () => image.replaceWith(logElement('p', 'Vista previa no disponible. Puedes abrir el archivo original.'));
            const open = logElement('button', 'Ampliar');
            open.type = 'button';
            open.onclick = () => logOpenPhoto(label, url, id, open);
            card.append(image, open, logOriginalLink(url));
            grid.append(card);
            count++;
        }
        section.append(grid);
        host.append(section);
    }
    if (!count) host.append(logElement('p', 'No hay fotos ni documentos disponibles en la respuesta de LOG para esta NV.', 'log-photo-message'));
}

const logPhotoCache = new Map();
const logPhotoRequests = new Map();
async function logFetchPhotos(nv) {
    const key = String(nv).trim().toUpperCase();
    const cached = logPhotoCache.get(key);
    if (cached && Date.now() - cached.time < 60000) return cached.result;
    if (logPhotoRequests.has(key)) return logPhotoRequests.get(key);
    const request = (async () => {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 25000);
        try {
            const response = await fetch(`${LOG_PHOTO_SERVICE}?nv=${encodeURIComponent(nv)}`, {signal:controller.signal,redirect:'follow'});
            if (!response.ok) throw new Error('No se pudo consultar LOG.');
            const result = await response.json();
            if (!result.success) throw new Error(result.error || 'LOG no devolvió los archivos de esta NV.');
            if (!Array.isArray(result.datos)) throw new Error('La respuesta de LOG no contiene una lista de archivos válida.');
            logPhotoCache.set(key, {time:Date.now(),result});
            if (logPhotoCache.size > 30) logPhotoCache.delete(logPhotoCache.keys().next().value);
            return result;
        } finally { clearTimeout(timeout); }
    })().finally(() => logPhotoRequests.delete(key));
    logPhotoRequests.set(key, request);
    return request;
}

async function logLoadPhotos(host, nv, vendor) {
    host.replaceChildren(logElement('p', 'Cargando fotos y documentos de LOG…', 'log-photo-message'));
    try {
        const result = await logFetchPhotos(nv);
        if (!host.isConnected) return;
        const records = result.datos.filter(record => String(record.numeroNV).trim().toUpperCase() === String(nv).trim().toUpperCase() && (!vendor || String(record.vendedor || '').trim().toUpperCase() === vendor));
        logRenderPhotos(host, records);
    } catch (error) {
        if (!host.isConnected) return;
        host.replaceChildren(logElement('p', error.name === 'AbortError' ? 'LOG tardó demasiado en responder. Vuelve a intentar.' : `No se pudieron cargar las fotos: ${error.message}`, 'log-photo-message'));
        const retry = logElement('button', 'Reintentar fotos');
        retry.type = 'button';
        retry.onclick = () => logLoadPhotos(host, nv, vendor);
        host.append(retry);
    }
}

function logMountGallery(nv, vendor) {
    const result = document.querySelector('#resultados .result-container');
    if (!result) return;
    const section = logElement('section', undefined, 'log-gallery');
    section.append(logElement('h3', '📸 Fotos y documentos de LOG'));
    const host = logElement('div');
    host.setAttribute('aria-live', 'polite');
    section.append(host);
    const exportSection = result.querySelector('.export-section');
    result.insertBefore(section, exportSection);
    logLoadPhotos(host, nv, vendor);
}

</script>
<script>
// Bounded, vendor-scoped Google Sheets queries; no third-party proxies or demo data.
const logFastColumns = 'A,B,C,D,E,F,J,K,L,M,N,O,P,Q,AC,AD,AH,AI,AJ,AK,AL,AM,AN,AO';
const logFastPending = new Map();
let logFastSequence = 0;
let logFastView = 0;
let logFastHasAll = false;
const logFastCacheKey = `log-nv-v3-${VENDEDOR}`;
const logFastVendorWhere = `(upper(D) = '${VENDEDOR}' or upper(M) = '${VENDEDOR}')`;

function logFastOwn(row) {
    return [row[3], row[12]].some(value => String(value || '').trim().toUpperCase() === VENDEDOR);
}
function logFastIndex(column) {
    return [...column].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0) - 1;
}
function logFastRows(table) {
    return (table.rows || []).map(record => {
        const row = Array(42).fill('');
        table.cols.forEach((column, index) => {
            const cell = record.c?.[index];
            row[logFastIndex(column.id)] = cell?.f ?? cell?.v ?? '';
        });
        return row;
    }).filter(logFastOwn);
}
function logFastQuery(where, limit = '') {
    const query = `select ${logFastColumns} where ${where}${limit ? ' limit ' + limit : ''}`;
    if (logFastPending.has(query)) return logFastPending.get(query);
    const promise = new Promise((resolve, reject) => {
        const callback = `logFast_${Date.now()}_${++logFastSequence}`;
        const script = document.createElement('script');
        const cleanup = () => {
            clearTimeout(timer);
            script.remove();
            // A late Google response must not revive an expired query.
            window[callback] = () => {};
            setTimeout(() => delete window[callback], 60000);
        };
        const timer = setTimeout(() => { cleanup(); reject(new Error('LOG no respondió en 10 segundos. Puedes reintentar.')); }, 10000);
        window[callback] = response => {
            cleanup();
            if (response.status !== 'ok' || !response.table) {
                reject(new Error('No se pudo consultar la planilla de LOG.')); return;
            }
            try { resolve(logFastRows(response.table)); } catch (error) { reject(error); }
        };
        script.onerror = () => { cleanup(); reject(new Error('No se pudo conectar con Google Sheets.')); };
        script.src = 'https://docs.google.com/spreadsheets/d/115hygvTHMNtF0KuQ3AcUgbhjA-WO1Nga3Kjra4wBZX0/gviz/tq?sheet=Registros&headers=1&tq=' + encodeURIComponent(query) + '&tqx=' + encodeURIComponent('out:json;responseHandler:' + callback);
        document.head.append(script);
    }).finally(() => logFastPending.delete(query));
    logFastPending.set(query, promise);
    return promise;
}
function logFastSave() {
    try { localStorage.setItem(logFastCacheKey, JSON.stringify({time: Date.now(), rows: datosCompletos.slice(0, 150)})); } catch {}
}
function logFastRestore() {
    try {
        const cached = JSON.parse(localStorage.getItem(logFastCacheKey));
        if (!cached || !Number.isFinite(cached.time) || !Array.isArray(cached.rows) || Date.now() - cached.time > 86400000) return false;
        datosCompletos = cached.rows.filter(row => Array.isArray(row) && logFastOwn(row));
        if (!datosCompletos.length) return false;
        ultimaActualizacion = new Date(cached.time);
        actualizarUltimaActualizacion();
        actualizarEstadoConexion('Datos guardados · actualizando…', 'info');
        return true;
    } catch { return false; }
}
function logFastError(message) {
    const host = document.getElementById('resultados');
    host.replaceChildren(logElement('p', message, 'log-photo-message'));
    const retry = logElement('button', 'Reintentar conexión');
    retry.className = 'btn btn-primary';
    retry.onclick = () => logFastLoad(true);
    host.append(retry);
}
async function logFastLoad(show = true) {
    const view = logFastView;
    actualizarEstadoConexion(datosCompletos.length ? 'Actualizando…' : 'Cargando NV recientes…', 'info');
    if (!datosCompletos.length && show) document.getElementById('resultados').textContent = 'Puedes ingresar una NV mientras se cargan los registros recientes.';
    try {
        const rows = await logFastQuery(logFastVendorWhere, 150);
        const recent = new Set(rows.map(row => String(row[1] || row[10])));
        datosCompletos = [...rows, ...datosCompletos.filter(row => !recent.has(String(row[1] || row[10])))];
        ultimaActualizacion = new Date();
        actualizarUltimaActualizacion();
        actualizarEstadoConexion(`✅ Listo · ${rows.length} NV recientes`, 'success');
        logFastSave();
        if (show && view === logFastView) document.getElementById('resultados').textContent = 'Busca una NV o consulta tus pedidos. Las fotos se cargan al abrir el detalle.';
    } catch (error) {
        actualizarEstadoConexion(datosCompletos.length ? 'Sin conexión · datos guardados' : 'Sin conexión', 'error');
        if (!datosCompletos.length && show && view === logFastView) logFastError(error.message);
    }
}
// Replace the old startup loaders before their window.load handlers execute.
if (typeof cargarDatos === 'function') cargarDatos = logFastLoad;
if (typeof cargarDatosOptimizado === 'function') cargarDatosOptimizado = logFastLoad;
logFastRestore();

buscarNVenDatos = function(nv) {
    const key = String(nv).trim().toUpperCase();
    const index = datosCompletos.findIndex(row => logFastOwn(row) && [row[1], row[10]].some(value => String(value || '').trim().toUpperCase() === key));
    return index < 0 ? {encontrada:false} : {encontrada:true, data:datosCompletos[index], fila:index+2};
};
const logFastRenderDetail = typeof mostrarResultadoMejorado === 'function' ? mostrarResultadoMejorado : mostrarResultado;
buscarNotaVenta = async function() {
    const nv = document.getElementById('numeroNV').value.trim();
    if (!nv) { logFastError('Ingresa un número de NV.'); return; }
    const view = ++logFastView;
    const found = buscarNVenDatos(nv);
    if (found.encontrada) { logFastRenderDetail(found); return; }
    document.getElementById('resultados').textContent = `Buscando NV ${nv}…`;
    try {
        // The two NV columns are numeric in the current Sheets query schema.
        if (!/^\d+$/.test(nv) || nv.length > 15) {
            logFastError('Esta búsqueda admite números de NV. Para referencias con letras, consulta LOG.'); return;
        }
        const number = String(Number(nv));
        const rows = await logFastQuery(`${logFastVendorWhere} and (B = ${number} or K = ${number})`);
        if (view !== logFastView) return;
        if (!rows.length) { document.getElementById('resultados').textContent = `No se encontró la NV ${nv} para el vendedor ${VENDEDOR}.`; return; }
        datosCompletos.push(...rows);
        logFastRenderDetail({encontrada:true,data:rows[0]});
    } catch (error) { if (view === logFastView) logFastError(error.message); }
};
for (const name of ['buscarTodasMisNV','buscarPendientes','buscarCompletadas']) {
    const original = window[name];
    window[name] = async function() {
        const view = ++logFastView;
        if (!logFastHasAll) {
            document.getElementById('resultados').textContent = 'Cargando las NV de tu vendedor…';
            try {
                const rows = await logFastQuery(logFastVendorWhere);
                datosCompletos = rows;
                logFastHasAll = true;
            } catch (error) { if (view === logFastView) logFastError(error.message); return; }
        }
        if (view === logFastView) original();
    };
}
// Refresh only in an active tab; hidden tabs should not download the sheet repeatedly.
toggleAutoRefresh = function() {
    if (intervalRefresh) clearInterval(intervalRefresh);
    intervalRefresh = null;
    if (document.getElementById('autoRefresh').checked) intervalRefresh = setInterval(() => {
        if (!document.hidden) logFastLoad(false);
    }, 120000);
    const next = document.getElementById('proximaActualizacion');
    if (next) next.textContent = document.getElementById('autoRefresh').checked ? 'Actualización en segundo plano cada 2 minutos' : 'Actualización automática desactivada';
};

</script>
